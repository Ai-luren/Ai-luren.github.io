<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">AI路人 · Ai Luren — AI Video Creator</title>
  <desc id="hero-desc">个人 AI 影像作品集，涵盖商业广告、创意短片、产品影像和视觉实验。电影片头式的黑色文字版面。</desc>
  <rect width="1200" height="340" rx="20" fill="#0b1018"/>
  <rect x="1" y="1" width="1198" height="338" rx="19" fill="none" stroke="#283241" stroke-width="2"/>
  <!-- Editorial film-credits grid: one visual identity, no fabricated stills. -->
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
    <text x="68" y="68" fill="#aab8c7" font-size="20" font-weight="600" letter-spacing="3">AI VIDEO CREATOR</text>
    <text x="69" y="177" fill="#f5f7fa" font-size="91" font-weight="700">AI路人</text>
    <text x="71" y="242" fill="#d6e0ed" font-size="45" font-weight="500" letter-spacing="1">Ai Luren</text>
    <path d="M695 72V266" stroke="#435269" stroke-width="2"/>
    <text x="742" y="107" fill="#8da4bb" font-size="18" font-weight="600" letter-spacing="2.5">SELECTED CREATIVE WORK</text>
    <text x="742" y="160" fill="#f3f5f8" font-size="31" font-weight="550">商业影像与创意叙事</text>
    <text x="742" y="210" fill="#f3f5f8" font-size="31" font-weight="550">Commercials &amp; Creative Films</text>
    <text x="742" y="256" fill="#a5b8ca" font-size="21">Concept  /  Frame  /  Film</text>
    <path d="M68 291H1132" stroke="#3b4759" stroke-width="1.5"/>
    <path d="M68 291H250" stroke="#a2bfd9" stroke-width="3"/>
    <text x="69" y="321" fill="#8497a9" font-size="17" letter-spacing="2">PORTFOLIO</text>
    <text x="1128" y="321" fill="#8497a9" font-size="17" text-anchor="end" letter-spacing="2">FILMS · VISUAL STORIES · EXPERIMENTS</text>
  </g>
</svg>
